<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fachri Achmad | Software Engineer & Flutter Developer Portfolio. A high-fidelity macOS inspired Flutter Web experience.">
  <meta name="keywords" content="flutter, flutter web, fachri achmad, software engineer, portfolio, macos, dart">
  <meta name="author" content="Fachri Achmad">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Fachri Achmad | Flutter Web Portfolio">
  <meta property="og:description" content="Software Engineer & Flutter Developer interactive macOS-inspired portfolio.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fachri Achmad">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fachri Achmad | Software Engineer & Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0f19;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out;
    }

    .apple-icon {
      font-size: 54px;
      color: #ffffff;
      animation: pulse 1.8s infinite ease-in-out;
    }

    .progress-bar-bg {
      margin-top: 28px;
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 40%;
      height: 100%;
      background: #ffffff;
      border-radius: 4px;
      animation: load 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes load {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div class="loader-container" id="loading">
    <div class="apple-icon"></div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
